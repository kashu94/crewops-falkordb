[project]
name = "crewops-falkordb"
version = "0.1.0"
description = "Crew-control agents that reason over a FalkorDB graph: disruption blast radius, legal cover, four-eyes plans, shared memory and a traceable decision path."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "falkordb>=1.8,<2",
  "mcp>=2.3,<3",
  "fastapi>=0.143",
  "uvicorn>=0.54",
  "anthropic>=1.15,<2",
  "httpx>=0.28",
]

[project.scripts]
crewops = "crewops.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format owns line length; long Cypher and message strings stay whole
